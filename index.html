<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>은찬 Games Studio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <span class="highlight">EC</span> GAMES
      </div>
      <button id="admin-toggle-btn" class="icon-btn">⚙️</button>
    </header>

    <main class="content">
      <section class="hero">
        <h1>은찬이의 <br><span class="gradient-text">게임 스튜디오</span></h1>
        <p>손끝에서 펼쳐지는 재미있는 HTML5 게임 모음</p>
      </section>

      <section id="admin-panel" class="admin-card hidden">
        <h2>🎮 새 게임 등록</h2>
        <form id="game-form">
          <input type="text" id="game-title" placeholder="게임 이름" required>
          <input type="text" id="game-thumb" placeholder="썸네일 이미지 URL" required>
          <input type="text" id="game-url" placeholder="게임 HTML 경로 (예: games/game1.html)" required>
          <button type="submit" class="btn-primary">등록하기</button>
        </form>
      </section>

      <section class="game-section">
        <h2>인기 게임 목록</h2>
        <div id="game-list" class="game-grid">
          </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
