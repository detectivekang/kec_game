<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가위바위보 게임</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 55px 10px 20px 10px;
        }

        .btn-home {
            position: fixed;
            top: 12px;
            left: 12px;
            background: #34495e;
            color: #ffffff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .btn-home:hover { background: #2980b9; }

        h1 {
            margin-top: 5px;
            margin-bottom: 12px;
            font-size: 22px;
            text-align: center;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 480px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            background: #34495e;
            color: #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #e67e22;
            border-color: #d35400;
            color: white;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 480px;
            margin-bottom: 12px;
            background: #34495e;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .score-p1 { color: #3498db; }
        .score-p2 { color: #e74c3c; }

        .game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #34495e;
            width: 100%;
            max-width: 480px;
            padding: 15px 10px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .result-text {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            min-height: 20px;
            text-align: center;
            color: #f1c40f;
            word-break: keep-all;
        }

        .arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }

        .section-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .section-title {
            font-size: 11px;
            font-weight: bold;
            color: #bdc3c7;
        }

        .hands-row {
            display: flex;
            gap: 2px;
            background: #2c3e50;
            padding: 3px;
            border-radius: 6px;
        }

        .mini-hand {
            font-size: 15px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: #7f8c8d;
            opacity: 0.3;
        }

        .mini-hand.active {
            opacity: 1;
            background: #f1c40f;
        }

        .center-box-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .final-box {
            font-size: 30px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            background: #2c3e50;
        }

        .final-box.selected {
            border-style: solid;
            border-color: #2ecc71;
            background: #e8f8f5;
            color: #2c3e50;
        }

        .vs-label {
            font-size: 12px;
            font-weight: bold;
            color: #bdc3c7;
        }

        .guide-box {
            font-size: 11px;
            color: #ecf0f1;
            background: #2c3e50;
            padding: 6px 8px;
            border-radius: 6px;
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .btn-container {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        button.action-btn {
            flex: 1;
            padding: 12px 6px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        #btn-start {
            background-color: #2ecc71;
            color: white;
        }
        #btn-start:active { background-color: #27ae60; }

        #btn-p1-stop {
            background-color: #3498db;
            color: white;
        }
        #btn-p1-stop:active { background-color: #2980b9; }

        #btn-p2-stop {
            background-color: #e74c3c;
            color: white;
        }
        #btn-p2-stop:active { background-color: #c0392b; }
        
        button:disabled {
            background-color: #7f8c8d !important;
            cursor: not-allowed;
            color: #bdc3c7 !important;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <a href="../index.html" class="btn-home">🏠 홈으로</a>

    <h1>가위바위보 대결 게임</h1>

    <div class="mode-selector">
        <button class="mode-btn active" id="mode-1p" onclick="setMode('1p')">1인용 (vs AI)</button>
        <button class="mode-btn" id="mode-2p" onclick="setMode('2p')">2인용 (친구 대결)</button>
    </div>

    <div class="score-board">
        <div class="score-p1"><span id="label-p1">플레이어</span>: <span id="p1-score">0</span>점</div>
        <div class="score-p2"><span id="label-p2">AI 봇</span>: <span id="p2-score">0</span>점</div>
    </div>

    <div class="game-screen">
        <div class="result-text" id="result-text">시작 버튼을 누르세요!</div>

        <div class="arena">
            <div class="section-group">
                <span class="section-title" id="title-p1">내 패</span>
                <div class="hands-row">
                    <div class="mini-hand" id="p1-h-0">✌️</div>
                    <div class="mini-hand" id="p1-h-1">✊</div>
                    <div class="mini-hand" id="p1-h-2">✋</div>
                </div>
            </div>

            <div class="center-box-container">
                <span class="vs-label" id="box-label-p1">나</span>
                <div class="final-box" id="p1-final">❓</div>
            </div>

            <div class="vs-label" style="font-size: 14px;">VS</div>

            <div class="center-box-container">
                <span class="vs-label" id="box-label-p2">AI</span>
                <div class="final-box" id="p2-final">❓</div>
            </div>

            <div class="section-group">
                <span class="section-title" id="title-p2">AI 패</span>
                <div class="hands-row">
                    <div class="mini-hand" id="p2-h-0">✌️</div>
                    <div class="mini-hand" id="p2-h-1">✊</div>
                    <div class="mini-hand" id="p2-h-2">✋</div>
                </div>
            </div>
        </div>

        <div class="guide-box" id="guide-box">
            <b>[안내]</b> 게임 시작 버튼을 터치하세요.
        </div>

        <div class="btn-container" id="btn-area">
            <button class="action-btn" id="btn-start">게임 시작</button>
            <button class="action-btn" id="btn-p1-stop" style="display:none;" disabled>P1 정지 (Space)</button>
            <button class="action-btn" id="btn-p2-stop" style="display:none;" disabled>P2 정지 (Enter)</button>
        </div>
    </div>

    <script>
        let currentMode = '1p';

        const p1ScoreSpan = document.getElementById('p1-score');
        const p2ScoreSpan = document.getElementById('p2-score');
        const labelP1 = document.getElementById('label-p1');
        const labelP2 = document.getElementById('label-p2');
        const titleP1 = document.getElementById('title-p1');
        const titleP2 = document.getElementById('title-p2');
        const boxLabelP1 = document.getElementById('box-label-p1');
        const boxLabelP2 = document.getElementById('box-label-p2');
        
        const resultText = document.getElementById('result-text');
        const btnStart = document.getElementById('btn-start');
        const btnP1Stop = document.getElementById('btn-p1-stop');
        const btnP2Stop = document.getElementById('btn-p2-stop');
        const guideBox = document.getElementById('guide-box');

        const p1FinalBox = document.getElementById('p1-final');
        const p2FinalBox = document.getElementById('p2-final');

        const hands = ['✌️', '✊', '✋']; 
        let p1Score = 0;
        let p2Score = 0;
        
        let p1Interval = null;
        let p2Interval = null;
        
        let isRunning = false;
        let p1Stopped = false;
        let p2Stopped = false;

        let curP1Index = 0;
        let curP2Index = 0;
        let finalP1Hand = '';
        let finalP2Hand = '';

        function setMode(mode) {
            if (isRunning) return; 
            currentMode = mode;
            
            document.getElementById('mode-1p').classList.remove('active');
            document.getElementById('mode-2p').classList.remove('active');

            if (mode === '1p') {
                document.getElementById('mode-1p').classList.add('active');
                labelP1.innerText = '플레이어';
                labelP2.innerText = 'AI 봇';
                titleP1.innerText = '내 패';
                titleP2.innerText = 'AI 패';
                boxLabelP1.innerText = '나';
                boxLabelP2.innerText = 'AI';
                guideBox.innerHTML = `<b>[1인용]</b> 시작 후 '정지' 버튼이나 [Space] 키를 누르세요.`;
                btnP1Stop.innerText = '정지하기 (Space)';
                btnP1Stop.style.display = 'block';
                btnP2Stop.style.display = 'none';
            } else {
                document.getElementById('mode-2p').classList.add('active');
                labelP1.innerText = '플레이어 1';
                labelP2.innerText = '플레이어 2';
                titleP1.innerText = 'P1 패';
                titleP2.innerText = 'P2 패';
                boxLabelP1.innerText = 'P1';
                boxLabelP2.innerText = 'P2';
                guideBox.innerHTML = `<b>[2인용]</b> 모바일: P1 / P2 버튼 터치 (🔒 둘 다 눌러야 공개!)<br>PC: P1=[Space] / P2=[Enter]`;
                btnP1Stop.innerText = 'P1 정지';
                btnP2Stop.innerText = 'P2 정지';
                btnP1Stop.style.display = 'block';
                btnP2Stop.style.display = 'block';
            }
            resetGame();
        }

        btnStart.addEventListener('click', startRound);
        btnP1Stop.addEventListener('click', () => {
            if (!isRunning || p1Stopped) return;
            stopP1();
            if (currentMode === '1p') {
                stopP2();
                finishRound();
            } else {
                checkBothStopped();
            }
        });

        btnP2Stop.addEventListener('click', () => {
            if (!isRunning || p2Stopped || currentMode !== '2p') return;
            stopP2();
            checkBothStopped();
        });

        function startRound() {
            if (isRunning) return;
            isRunning = true;
            p1Stopped = false;
            p2Stopped = false;

            btnStart.disabled = true;
            btnP1Stop.disabled = false;
            if (currentMode === '2p') btnP2Stop.disabled = false;

            p1FinalBox.classList.remove('selected');
            p2FinalBox.classList.remove('selected');
            p1FinalBox.innerText = '🔄';
            p2FinalBox.innerText = '🔄';

            if (currentMode === '1p') {
                btnStart.innerText = '진행 중...';
                resultText.innerText = '돌아가는 중! 정지 버튼을 누르세요!';
            } else {
                btnStart.innerText = '진행 중...';
                resultText.innerText = '초고속 롤링 중! 각자 정지 버튼을 누르세요!';
            }

            p1Interval = setInterval(() => updateHand('p1'), 35);
            p2Interval = setInterval(() => updateHand('p2'), 35);
        }

        function updateHand(player) {
            if (player === 'p1' && p1Stopped) return;
            if (player === 'p2' && p2Stopped) return;

            if (player === 'p1') {
                document.querySelectorAll('#p1-h-0, #p1-h-1, #p1-h-2').forEach(el => el.classList.remove('active'));
                curP1Index = Math.floor(Math.random() * 3);
                document.getElementById(`p1-h-${curP1Index}`).classList.add('active');
                if (currentMode === '1p') p1FinalBox.innerText = hands[curP1Index];
            } else {
                document.querySelectorAll('#p2-h-0, #p2-h-1, #p2-h-2').forEach(el => el.classList.remove('active'));
                curP2Index = Math.floor(Math.random() * 3);
                document.getElementById(`p2-h-${curP2Index}`).classList.add('active');
                if (currentMode === '1p') p2FinalBox.innerText = hands[curP2Index];
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                resetGame();
                return;
            }

            if (!isRunning && e.code === 'Space') {
                e.preventDefault();
                startRound();
                return;
            }

            if (isRunning) {
                if (currentMode === '1p') {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        stopP1();
                        stopP2();
                        finishRound();
                    }
                } else if (currentMode === '2p') {
                    if (e.code === 'Space' && !p1Stopped) {
                        e.preventDefault();
                        stopP1();
                        checkBothStopped();
                    }

                    if (e.code === 'Enter' && !p2Stopped) {
                        e.preventDefault();
                        stopP2();
                        checkBothStopped();
                    }
                }
            }
        });

        function stopP1() {
            p1Stopped = true;
            clearInterval(p1Interval);
            finalP1Hand = hands[curP1Index];
            btnP1Stop.disabled = true;

            if (currentMode === '1p') {
                document.getElementById(`p1-h-${curP1Index}`).classList.add('active');
                p1FinalBox.classList.add('selected');
                p1FinalBox.innerText = finalP1Hand;
            } else {
                // 2인용 대결 시 하이라이트 완전히 제거하여 패 숨기기
                document.querySelectorAll('#p1-h-0, #p1-h-1, #p1-h-2').forEach(el => el.classList.remove('active'));
                p1FinalBox.innerText = '🔒';
            }
        }

        function stopP2() {
            p2Stopped = true;
            clearInterval(p2Interval);
            finalP2Hand = hands[curP2Index];
            btnP2Stop.disabled = true;

            if (currentMode === '1p') {
                document.getElementById(`p2-h-${curP2Index}`).classList.add('active');
                p2FinalBox.classList.add('selected');
                p2FinalBox.innerText = finalP2Hand;
            } else {
                // 2인용 대결 시 하이라이트 완전히 제거하여 패 숨기기
                document.querySelectorAll('#p2-h-0, #p2-h-1, #p2-h-2').forEach(el => el.classList.remove('active'));
                p2FinalBox.innerText = '🔒';
            }
        }

        function checkBothStopped() {
            if (p1Stopped && p2Stopped) {
                finishRound();
            } else {
                if (p1Stopped) resultText.innerText = 'P1 선택 완료 (🔒)! P2 정지 대기 중...';
                if (p2Stopped) resultText.innerText = 'P2 선택 완료 (🔒)! P1 정지 대기 중...';
            }
        }

        function finishRound() {
            clearInterval(p1Interval);
            clearInterval(p2Interval);
            
            isRunning = false;
            btnStart.innerText = '다음 판 시작';
            btnStart.disabled = false;
            btnP1Stop.disabled = true;
            btnP2Stop.disabled = true;

            finalP1Hand = hands[curP1Index];
            finalP2Hand = hands[curP2Index];

            // 2인용 대결 결과 및 하이라이트 동시에 공개
            p1FinalBox.innerText = finalP1Hand;
            p2FinalBox.innerText = finalP2Hand;
            p1FinalBox.classList.add('selected');
            p2FinalBox.classList.add('selected');
            
            document.querySelectorAll('#p1-h-0, #p1-h-1, #p1-h-2').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('#p2-h-0, #p2-h-1, #p2-h-2').forEach(el => el.classList.remove('active'));
            document.getElementById(`p1-h-${curP1Index}`).classList.add('active');
            document.getElementById(`p2-h-${curP2Index}`).classList.add('active');

            let message = '';
            let p1Update = 0;
            let p2Update = 0;

            if (finalP1Hand === finalP2Hand) {
                message = `🤝 비겼습니다! (${finalP1Hand} vs ${finalP2Hand})`;
            } else if (
                (finalP1Hand === '✌️' && finalP2Hand === '✋') ||
                (finalP1Hand === '✊' && finalP2Hand === '✌️') ||
                (finalP1Hand === '✋' && finalP2Hand === '✊')
            ) {
                let winnerName = currentMode === '1p' ? '플레이어' : 'P1';
                message = `🎉 ${winnerName} 승리! (${finalP1Hand} vs ${finalP2Hand})`;
                p1Update = 1;
            } else {
                let winnerName = currentMode === '1p' ? 'AI 봇' : 'P2';
                message = `🎉 ${winnerName} 승리! (${finalP1Hand} vs ${finalP2Hand})`;
                p2Update = 1;
            }

            resultText.innerText = message;
            
            p1Score += p1Update;
            p2Score += p2Update;
            p1ScoreSpan.innerText = p1Score;
            p2ScoreSpan.innerText = p2Score;

            let targetNameP1 = currentMode === '1p' ? '플레이어' : 'P1';
            let targetNameP2 = currentMode === '1p' ? 'AI 봇' : 'P2';

            if (p1Score >= 10) {
                alert(`🏆 ${targetNameP1}이(가) 10점을 먼저 달성하여 최종 승리했습니다!`);
                resetGame();
            } else if (p2Score >= 10) {
                alert(`🏆 ${targetNameP2}이(가) 10점을 먼저 달성하여 최종 승리했습니다!`);
                resetGame();
            }
        }

        function resetGame() {
            clearInterval(p1Interval);
            clearInterval(p2Interval);
            isRunning = false;
            p1Stopped = false;
            p2Stopped = false;

            p1Score = 0;
            p2Score = 0;
            p1ScoreSpan.innerText = '0';
            p2ScoreSpan.innerText = '0';
            resultText.innerText = '시작 버튼을 누르세요!';
            btnStart.innerText = '게임 시작';
            btnStart.disabled = false;
            btnP1Stop.disabled = true;
            btnP2Stop.disabled = true;

            p1FinalBox.innerText = '❓';
            p2FinalBox.innerText = '❓';
            p1FinalBox.classList.remove('selected');
            p2FinalBox.classList.remove('selected');
            document.querySelectorAll('.mini-hand').forEach(el => el.classList.remove('active'));
        }

        setMode('1p');
    </script>
</body>
</html>
